<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora do cidadão</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="secao_principal">
      <header>
        <h1 class="titulo">Calculadora do cidadão</h1>
        <h2>Intrução de como utilizar:</h2>
        <p id="paragrafoTitulo">
          Coloque três valores e terá o terceiro como resposta
        </p>
      </header>
      <form id="form" method="get" class="">
        <div>
          <p>Numero de meses:</p>
          <input type="number" max="108" class="input" id="iMeses" />
        </div>
        <div>
          <p>Taxa:</p>
          <input type="text" class="input" id="iTaxa" />
        </div>
        <div>
          <p>Valor da parcela:</p>
          <input type="text" class="input" id="iValorParcela" />
        </div>
        <div>
          <p>Valor do saldo devedor:</p>
          <input type="text" class="input" id="iSaldo" />
        </div>
        <div class="form-actions">
          <button id="button" type="submit">Calcular</button>
          <button id="buttonLimpar" type="reset">Limpar</button>
        </div>
      </form>
    </main>
  </body>
  <script type="module" src="scripts/app.js"></script>
</html>
